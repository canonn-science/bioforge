name: Build chart data

# Rebuild data/samples.json (the landing-page charts) from the Canonn biostats API
# whenever something is committed to main, then commit the refreshed file back.
on:
  push:
    branches: [main]
    paths-ignore:
      - data/samples.json
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-samples
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build data/samples.json
        run: python tools/build_samples_data.py

      - name: Sanity check
        run: |
          python - <<'EOF'
          import json
          d = json.load(open("data/samples.json"))
          assert len(d["entries"]) > 500 and len(d["species"]) > 50, "suspiciously small dataset"
          print(len(d["entries"]), "entries,", len(d["species"]), "species")
          EOF

      - name: Commit refreshed data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/samples.json
          if git diff --cached --quiet; then
            echo "Chart data unchanged"
          else
            git commit -m "Refresh chart data [skip ci]"
            git push
          fi
